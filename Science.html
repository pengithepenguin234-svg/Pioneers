    function StarfieldCanvas({ pan, zoom, reducedMotion }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const layers = [
          { count: 140, speedFactor: 0.08, minR: 0.5, maxR: 1.1, alpha: 0.35 },
          { count: 95, speedFactor: 0.18, minR: 0.8, maxR: 1.6, alpha: 0.55 },
          { count: 45, speedFactor: 0.32, minR: 1.2, maxR: 2.1, alpha: 0.78 }
        ];

        const stars = [];
        layers.forEach((layer, layerIdx) => {
          for (let i = 0; i < layer.count; i++) {
            stars.push({
              x: Math.random(),
              y: Math.random(),
              r: layer.minR + Math.random() * (layer.maxR - layer.minR),
              baseAlpha: layer.alpha * (0.6 + Math.random() * 0.4),
              twinklePhase: Math.random() * Math.PI * 2,
              twinkleSpeed: 0.008 + Math.random() * 0.015,
              speedFactor: layer.speedFactor,
              layerIdx,
              tint: layerIdx === 2 && i % 7 === 0 ? '#a5f3fc' : layerIdx === 1 && i % 9 === 0 ? '#ddd6fe' : '#f5f5f7'
            });
          }
        });

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        let tick = 0;
        const render = () => {
          tick += 1;
          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          // Subtle atmospheric nebula gradients
          const g1 = ctx.createRadialGradient(w * 0.2, h * 0.25, 20, w * 0.2, h * 0.25, w * 0.45);
          g1.addColorStop(0, 'rgba(34, 211, 238, 0.045)');
          g1.addColorStop(1, 'rgba(5, 5, 7, 0)');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, w, h);

          const g2 = ctx.createRadialGradient(w * 0.78, h * 0.7, 20, w * 0.78, h * 0.7, w * 0.45);
          g2.addColorStop(0, 'rgba(168, 85, 247, 0.045)');
          g2.addColorStop(1, 'rgba(5, 5, 7, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, w, h);

          const zoomScale = 0.85 + (zoom - 0.5) * 0.25;

          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const driftX = reducedMotion ? 0 : Math.cos(tick * 0.0015 + s.twinklePhase) * 6 * s.speedFactor;
            const driftY = reducedMotion ? 0 : Math.sin(tick * 0.0012 + s.twinklePhase) * 4 * s.speedFactor;

            let sx = ((s.x * w + pan.x * s.speedFactor + driftX) % w + w) % w;
            let sy = ((s.y * h + pan.y * s.speedFactor * 0.5 + driftY) % h + h) % h;

            const twinkle = reducedMotion
              ? 1
              : 0.78 + 0.22 * Math.sin(tick * s.twinkleSpeed + s.twinklePhase);

            ctx.beginPath();
            ctx.arc(sx, sy, s.r * zoomScale, 0, Math.PI * 2);
            ctx.fillStyle = s.tint;
            ctx.globalAlpha = Math.max(0.08, Math.min(0.95, s.baseAlpha * twinkle));
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          if (!reducedMotion) {
            animId = requestAnimationFrame(render);
          }
        };

        render();

        return () => {
          window.removeEventListener('resize', resize);
          if (animId) cancelAnimationFrame(animId);
        };
      }, [pan.x, pan.y, zoom, reducedMotion]);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          style={{
            position: 'fixed',
            inset: 0,
            width: '100%',
            height: '100%',
            pointerEvents: 'none',
            zIndex: 0
          }}
        />
      );
    }

          <text x="14" y="20" fill="#9ca3af" fontSize="10">Molecular Mechanism Overview — Targeted Genetic Information Flow</text>
          <rect x="20" y="36" width="96" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" />
          <text x="68" y="56" textAnchor="middle" fill="#f5f5f7" fontSize="10">Input / Target</text>
          <line x1="116" y1="52" x2="136" y2="52" stroke={accentColor} strokeWidth="2" />
          <rect x="136" y="36" width="96" height="32" rx="6" fill="rgba(34,211,238,0.12)" stroke={accentColor} />
          <text x="184" y="56" textAnchor="middle" fill="#f5f5f7" fontSize="10">Biochemical Action</text>
          <line x1="232" y1="52" x2="252" y2="52" stroke={accentColor} strokeWidth="2" />
          <rect x="252" y="36" width="88" height="32" rx="6" fill="rgba(168,85,247,0.14)" stroke="#a855f7" />

    function App() {
      const worldWidth = 8300;
      const worldHeight = 760;
      const spineY = worldHeight / 2;

      const [pan, setPan] = useState({ x: 80, y: 0 });
      const [zoom, setZoom] = useState(0.82);
      const [selectedId, setSelectedId] = useState(null);
      const [hoveredId, setHoveredId] = useState(null);
      const [activeEra, setActiveEra] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [reducedMotion, setReducedMotion] = useState(() => {
        if (typeof window !== 'undefined' && window.matchMedia) {
          return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }
        return false;
      });
      const [showGlossary, setShowGlossary] = useState(false);
      const [showCompare, setShowCompare] = useState(false);
      const [showSources, setShowSources] = useState(false);
      const [compareIds, setCompareIds] = useState(['mendel-1865', 'doudna-charpentier-2012']);
      const [loadedNotice, setLoadedNotice] = useState(true);

      const isDraggingRef = useRef(false);
      const dragStartRef = useRef({ x: 0, y: 0, panX: 0, panY: 0 });
      const touchRef = useRef({ dist: null, midX: 0, midY: 0 });
      const animFrameRef = useRef(null);

      useEffect(() => {
        const timer = setTimeout(() => setLoadedNotice(false), 1400);
        return () => clearTimeout(timer);
      }, []);

      const animateCameraTo = useCallback((targetPanX, targetPanY, targetZoom) => {
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (reducedMotion) {
          setPan({ x: targetPanX, y: targetPanY });
          setZoom(targetZoom);
          return;
        }

        const startPan = { ...pan };
        const startZoom = zoom;
        const duration = 520;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const ease = 1 - Math.pow(1 - t, 3);

          setPan({
            x: startPan.x + (targetPanX - startPan.x) * ease,
            y: startPan.y + (targetPanY - startPan.y) * ease
          });
          setZoom(startZoom + (targetZoom - startZoom) * ease);

          if (t < 1) {
            animFrameRef.current = requestAnimationFrame(step);
          }
        };

        animFrameRef.current = requestAnimationFrame(step);
      }, [pan, zoom, reducedMotion]);

      const focusMilestone = useCallback((m, targetZoom = 1.0) => {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const nodeY = m.position === 'top' ? spineY - 140 : spineY + 140;
        const panelOffset = viewW >= 900 ? -180 : 0;
        const desiredPanX = viewW / 2 + panelOffset - m.x * targetZoom;
        const desiredPanY = viewH / 2 - nodeY * targetZoom;
        animateCameraTo(desiredPanX, desiredPanY, targetZoom);
      }, [animateCameraTo, spineY]);

      const handleSelectMilestone = useCallback((m) => {
        setSelectedId(m.id);
        focusMilestone(m, Math.max(0.95, Math.min(1.2, zoom)));
      }, [focusMilestone, zoom]);

      const handleResetView = useCallback(() => {
        setSelectedId(null);
        setActiveEra('all');
        setSearchQuery('');
        const viewH = window.innerHeight;
        animateCameraTo(90, viewH / 2 - spineY * 0.82, 0.82);
      }, [animateCameraTo, spineY]);

      const handleFitAll = useCallback(() => {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const fitZoom = Math.max(0.22, Math.min(0.85, (viewW - 120) / worldWidth));
        const offsetY = (viewH - worldHeight * fitZoom) / 2;
        animateCameraTo(60, offsetY, fitZoom);
      }, [animateCameraTo, worldWidth, worldHeight]);

      const handleEraSelect = useCallback((eraId) => {
        setActiveEra(eraId);
        if (eraId === 'all') {
          handleResetView();
          return;
        }
        const firstInEra = MILESTONES.find((m) => m.eraId === eraId);
        if (firstInEra) {

        }
      }, [focusMilestone, handleResetView]);

      // Escape key closes panel/modals
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setSelectedId(null);
            setShowGlossary(false);
            setShowCompare(false);
            setShowSources(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      // Wheel zoom centered at cursor
      const handleWheel = useCallback((e) => {
        e.preventDefault();
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        const nextZoom = Math.max(0.22, Math.min(2.2, zoom * factor));
        const rect = e.currentTarget.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;

        const worldX = (cx - pan.x) / zoom;
        const worldY = (cy - pan.y) / zoom;

        setZoom(nextZoom);
        setPan({
          x: cx - worldX * nextZoom,
          y: cy - worldY * nextZoom
        });
      }, [pan.x, pan.y, zoom]);

      const handleMouseDown = (e) => {
        if (e.button !== 0) return;
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        isDraggingRef.current = true;
        dragStartRef.current = { x: e.clientX, y: e.clientY, panX: pan.x, panY: pan.y };
      };

      const handleMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - dragStartRef.current.x;
        const dy = e.clientY - dragStartRef.current.y;
        setPan({
          x: dragStartRef.current.panX + dx,
          y: dragStartRef.current.panY + dy
        });
      };

      const handleMouseUp = () => {
        isDraggingRef.current = false;
      };

      // Touch pan & pinch-zoom
      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          isDraggingRef.current = true;
          dragStartRef.current = {
            x: e.touches[0].clientX,
            y: e.touches[0].clientY,
            panX: pan.x,
            panY: pan.y
          };
        } else if (e.touches.length === 2) {
          isDraggingRef.current = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          touchRef.current.dist = Math.hypot(dx, dy);
          touchRef.current.midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          touchRef.current.midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 1 && isDraggingRef.current) {
          const dx = e.touches[0].clientX - dragStartRef.current.x;
          const dy = e.touches[0].clientY - dragStartRef.current.y;
          setPan({
            x: dragStartRef.current.panX + dx,
            y: dragStartRef.current.panY + dy
          });
        } else if (e.touches.length === 2 && touchRef.current.dist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const newDist = Math.hypot(dx, dy);
          const scaleRatio = newDist / touchRef.current.dist;
          const nextZoom = Math.max(0.22, Math.min(2.2, zoom * scaleRatio));
          const mx = touchRef.current.midX;
          const my = touchRef.current.midY;
          const worldX = (mx - pan.x) / zoom;
          const worldY = (my - pan.y) / zoom;

          touchRef.current.dist = newDist;
          setZoom(nextZoom);
          setPan({
            x: mx - worldX * nextZoom,
            y: my - worldY * nextZoom
          });
        }
      };

      const handleTouchEnd = () => {
        isDraggingRef.current = false;
        touchRef.current.dist = null;
      };

      const searchMatches = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        return MILESTONES.filter((m) =>
          m.title.toLowerCase().includes(q) ||

      const selectedMilestone = useMemo(

      const selectedIndex = useMemo(
        () => MILESTONES.findIndex((m) => m.id === selectedId),

      const nextMilestone = useMemo(() => {

      const eraMap = useMemo(() => {

      }, []);

      const milestoneMap = useMemo(() => {
        const map = {};
        MILESTONES.forEach((m) => { map[m.id] = m; });
        return map;
      }, []);

      const compareA = milestoneMap[compareIds[0]] || MILESTONES[0];
      const compareB = milestoneMap[compareIds[1]] || MILESTONES[11];

      return (
        <div

                </section>
              </div>

              <div style={{ padding: '12px 18px', borderTop: '1px solid rgba(255,255,255,0.09)', backgroundColor: '#0e0e13' }}>
                <button
                  type="button"
                  onClick={() => handleSelectMilestone(nextMilestone)}
                  style={{
                    width: '100%',
                    padding: '11px 14px',
                    borderRadius: 10,
                    background: 'linear-gradient(90deg, #0891b2, #2563eb)',
                    color: '#F5F5F7',
                    border: 'none',
                    fontWeight: 700,
                    fontSize: 12,
                    letterSpacing: '0.04em',
                    cursor: 'pointer'
                  }}
                >
                  EXPLORE NEXT DISCOVERY → {nextMilestone.year} ({nextMilestone.title})
                </button>
              </div>
            </aside>
          )}

          {/* Glossary Modal */}
          {showGlossary && (
            <div
              onClick={() => setShowGlossary(false)}
              style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.72)', zIndex: 60, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="selectable-text"
                style={{ width: 'min(640px, 100%)', maxHeight: '82vh', overflowY: 'auto', borderRadius: 16, backgroundColor: '#111116', border: '1px solid rgba(255,255,255,0.14)', padding: 20 }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                  <h2 className="font-display" style={{ fontSize: 18, fontWeight: 700 }}>Scientific Glossary</h2>
                  <button type="button" onClick={() => setShowGlossary(false)} style={{ padding: '4px 10px', borderRadius: 8, background: 'rgba(255,255,255,0.08)', color: '#F5F5F7', border: 'none', cursor: 'pointer' }}>Close</button>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {GLOSSARY.map((item) => (
                    <div key={item.term} style={{ padding: 12, borderRadius: 10, backgroundColor: '#0b0b10', border: '1px solid rgba(255,255,255,0.07)' }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: '#22d3ee' }}>{item.term}</div>
                      <div style={{ fontSize: 12, color: '#d1d5db', marginTop: 4, lineHeight: 1.5 }}>{item.def}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Pioneer Comparison Modal */}
          {showCompare && (
            <div
              onClick={() => setShowCompare(false)}
              style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.72)', zIndex: 60, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="selectable-text"
                style={{ width: 'min(780px, 100%)', maxHeight: '84vh', overflowY: 'auto', borderRadius: 16, backgroundColor: '#111116', border: '1px solid rgba(255,255,255,0.14)', padding: 20 }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                  <h2 className="font-display" style={{ fontSize: 18, fontWeight: 700 }}>Compare Two Milestones</h2>
                  <button type="button" onClick={() => setShowCompare(false)} style={{ padding: '4px 10px', borderRadius: 8, background: 'rgba(255,255,255,0.08)', color: '#F5F5F7', border: 'none', cursor: 'pointer' }}>Close</button>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12, marginBottom: 16 }}>
                  <select
                    value={compareIds[0]}
                    onChange={(e) => setCompareIds([e.target.value, compareIds[1]])}
                    style={{ padding: 8, borderRadius: 8, background: '#09090d', color: '#F5F5F7', border: '1px solid rgba(255,255,255,0.16)' }}
                  >
                    {MILESTONES.map((m) => <option key={m.id} value={m.id}>{m.year} — {m.title}</option>)}
                  </select>
                  <select
                    value={compareIds[1]}
                    onChange={(e) => setCompareIds([compareIds[0], e.target.value])}
                    style={{ padding: 8, borderRadius: 8, background: '#09090d', color: '#F5F5F7', border: '1px solid rgba(255,255,255,0.16)' }}
                  >
                    {MILESTONES.map((m) => <option key={m.id} value={m.id}>{m.year} — {m.title}</option>)}
                  </select>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 14 }}>
                  {[compareA, compareB].map((item) => (
                    <div key={item.id} style={{ padding: 14, borderRadius: 12, backgroundColor: '#0b0b10', border: '1px solid rgba(255,255,255,0.08)' }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: eraMap[item.eraId].color }}>{item.year} • {eraMap[item.eraId].shortName}</div>
                      <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, marginTop: 4 }}>{item.title}</h3>
                      <div style={{ fontSize: 12, color: '#9ca3af', marginTop: 2 }}>{item.pioneers.join(', ')}</div>
                      <p style={{ fontSize: 12, color: '#d1d5db', marginTop: 10, lineHeight: 1.55 }}><strong>Contribution:</strong> {item.contribution}</p>
                      <p style={{ fontSize: 12, color: '#d1d5db', marginTop: 8, lineHeight: 1.55 }}><strong>Significance:</strong> {item.importance}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Sources & Attribution Modal */}
          {showSources && (
            <div
              onClick={() => setShowSources(false)}
              style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.72)', zIndex: 60, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="selectable-text"
                style={{ width: 'min(620px, 100%)', maxHeight: '80vh', overflowY: 'auto', borderRadius: 16, backgroundColor: '#111116', border: '1px solid rgba(255,255,255,0.14)', padding: 20 }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <h2 className="font-display" style={{ fontSize: 18, fontWeight: 700 }}>Research Sources & Attribution</h2>
                  <button type="button" onClick={() => setShowSources(false)} style={{ padding: '4px 10px', borderRadius: 8, background: 'rgba(255,255,255,0.08)', color: '#F5F5F7', border: 'none', cursor: 'pointer' }}>Close</button>
                </div>
                <p style={{ fontSize: 12, color: '#d1d5db', lineHeight: 1.6, marginBottom: 12 }}>
                  Historical milestones and attributions in this interactive archive are grounded in authoritative scientific and archival references including the National Human Genome Research Institute (NHGRI), Nobel Prize archives, NIH/PubMed, Smithsonian Institution, and U.S. FDA resources. Portrait badges use typographic monograms with era-coded rings so no broken or unverified images appear offline or across networks.
                </p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, fontSize: 12 }}>
                  <a href="https://www.genome.gov/" target="_blank" rel="noopener noreferrer" style={{ color: '#67e8f9' }}>National Human Genome Research Institute (genome.gov) ↗</a>
                  <a href="https://www.nobelprize.org/" target="_blank" rel="noopener noreferrer" style={{ color: '#67e8f9' }}>The Nobel Prize Archive (nobelprize.org) ↗</a>
                  <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener noreferrer" style={{ color: '#67e8f9' }}>National Library of Medicine / PubMed (pubmed.ncbi.nlm.nih.gov) ↗</a>
                  <a href="https://www.si.edu/" target="_blank" rel="noopener noreferrer" style={{ color: '#67e8f9' }}>Smithsonian Institution (si.edu) ↗</a>
                  <a href="https://www.fda.gov/" target="_blank" rel="noopener noreferrer" style={{ color: '#67e8f9' }}>U.S. Food and Drug Administration (fda.gov) ↗</a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
